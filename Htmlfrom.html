<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="/action">
      <div>
          <label for="Username">Username : </label>
          <input type="text" placeholder="Enter Username" id="Username" name="Username" >
      </div>
      <div>
          <label for="Password">Password : </label>
          <input type="password" placeholder="Enter Password" id="Password">
      </div>
      <div>
          <label for="Age">Enter Age : </label>
          <input type="number" placeholder="Enter age" id="age"> 
       </div>
       <div>
          <input type="checkbox" id="age" name="age">
          <label for="age">I am 18+</label>
       </div>
      <button>Submit</button>
      <button type="reset">Reset</button>
    </form>
    <hr>
    <form action="https://www.youtube.com/results">
        <div>
          <label for="Username">Username : </label>
          <input type="text" placeholder="Enter Username" id="Username" name="Username" >
      </div>
      <div>
          <label for="Password">Password : </label>
          <input type="password" placeholder="Enter Password" id="Password">
      </div>
      <div>
        <label for="Search">Search in youtube :- </label>
        <input type="text" placeholder="Search in Youtube" id="Search" name="search_query">
      </div>
      <button>Search</button>
      </form>
      <hr>
      <form action="https://www.google.com/search">
      <div>
      <!-----  <label for="Search">Search in Google :- </label>-->
        <input type="text" placeholder="Search in Google" name="q">
      </div>
      <button>Search</button>
      </form>

</body>
</html>
